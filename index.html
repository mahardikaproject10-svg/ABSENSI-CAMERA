<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Kamera Absensi</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin: 8px 0 15px 0;
    }

    video {
      width: 100%;
      max-height: 65vh;
      object-fit: cover;
      background: #000;
      border-radius: 12px;
      transform: scaleX(-1);
    }

    canvas {
      display: none;
    }

    .preview {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #000;
      border-radius: 12px;
    }

    button {
      width: 100%;
      min-height: 52px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .ambil {
      background: #198754;
      color: white;
    }

    .gunakan {
      background: #0d6efd;
      color: white;
    }

    .ulang {
      background: #ffc107;
      color: #222;
    }

    .batal {
      background: #dc3545;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #222;
      font-weight: bold;
      line-height: 1.5;
    }

    .info {
      font-size: 14px;
      opacity: .85;
      margin-bottom: 10px;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>📷 KAMERA ABSENSI</h2>

  <div class="info">
    Gunakan kamera untuk mengambil foto absensi.
  </div>


  <!-- VIDEO KAMERA -->

  <video
    id="video"
    autoplay
    playsinline>
  </video>


  <!-- HASIL FOTO -->

  <img
    id="preview"
    class="preview hidden"
    alt="Preview foto">


  <!-- CANVAS -->

  <canvas
    id="canvas">
  </canvas>


  <!-- TOMBOL AMBIL -->

  <button
    id="btnAmbil"
    class="ambil"
    onclick="ambilFoto()">

    📸 AMBIL FOTO

  </button>


  <!-- TOMBOL GUNAKAN -->

  <button
    id="btnGunakan"
    class="gunakan hidden"
    onclick="gunakanFoto()">

    ✅ GUNAKAN FOTO

  </button>


  <!-- TOMBOL ULANG -->

  <button
    id="btnUlang"
    class="ulang hidden"
    onclick="ulangFoto()">

    🔄 ULANGI FOTO

  </button>


  <!-- TOMBOL BATAL -->

  <button
    id="btnBatal"
    class="batal"
    onclick="batal()">

    ❌ BATAL

  </button>


  <div id="status">
    Menyiapkan kamera...
  </div>

</div>


<script>


/* ============================================================
   PARAMETER DARI APPS SCRIPT
   ============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


const token =
  params.get('token') || '';


const action =
  params.get('action') || '';


const returnOrigin =
  params.get('returnOrigin') || '';


/* ============================================================
   VARIABEL
   ============================================================ */

let stream =
  null;

let fotoBase64 =
  '';


/* ============================================================
   ELEMENT
   ============================================================ */

const video =
  document.getElementById(
    'video'
  );

const preview =
  document.getElementById(
    'preview'
  );

const canvas =
  document.getElementById(
    'canvas'
  );

const btnAmbil =
  document.getElementById(
    'btnAmbil'
  );

const btnGunakan =
  document.getElementById(
    'btnGunakan'
  );

const btnUlang =
  document.getElementById(
    'btnUlang'
  );

const btnBatal =
  document.getElementById(
    'btnBatal'
  );

const status =
  document.getElementById(
    'status'
  );


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  pesan
) {

  status.textContent =
    pesan;

}


/* ============================================================
   VALIDASI
   ============================================================ */

if (
  !token ||
  !action ||
  !returnOrigin
) {

  setStatus(
    '❌ Halaman kamera dibuka tanpa data absensi yang lengkap.'
  );

  btnAmbil.disabled =
    true;

}


/* ============================================================
   BUKA KAMERA
   ============================================================ */

async function bukaKamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    setStatus(
      '📷 Meminta izin kamera...'
    );


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'user'
          },

          width: {
            ideal: 720
          },

          height: {
            ideal: 960
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    setStatus(
      '📷 Kamera siap. Arahkan kamera ke wajah lalu tekan AMBIL FOTO.'
    );


  } catch (error) {

    console.error(error);


    setStatus(
      '❌ Kamera tidak dapat dibuka. Pastikan izin kamera browser sudah diizinkan dan gunakan HTTPS.'
    );


    btnAmbil.disabled =
      true;

  }

}


/* ============================================================
   AMBIL FOTO
   ============================================================ */

function ambilFoto() {

  if (
    !stream ||
    !video.videoWidth
  ) {

    setStatus(
      '❌ Kamera belum siap.'
    );

    return;
  }


  /*
   * Maksimal lebar foto 720px
   * agar ukuran data tidak terlalu besar.
   */

  const maxWidth =
    720;

  const ratio =
    video.videoHeight /
    video.videoWidth;


  let width =
    Math.min(
      video.videoWidth,
      maxWidth
    );

  let height =
    Math.round(
      width * ratio
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      '2d'
    );


  /*
   * Kamera depan ditampilkan mirror.
   * Foto juga dibuat mirror agar
   * sesuai dengan tampilan pengguna.
   */

  ctx.save();

  ctx.translate(
    width,
    0
  );

  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  ctx.restore();


  /*
   * JPEG kualitas 70%
   */

  fotoBase64 =
    canvas.toDataURL(
      'image/jpeg',
      0.70
    );


  preview.src =
    fotoBase64;


  video.classList.add(
    'hidden'
  );

  preview.classList.remove(
    'hidden'
  );


  btnAmbil.classList.add(
    'hidden'
  );

  btnGunakan.classList.remove(
    'hidden'
  );

  btnUlang.classList.remove(
    'hidden'
  );


  setStatus(
    'Foto berhasil diambil. Pastikan foto sudah benar.'
  );

}


/* ============================================================
   ULANGI FOTO
   ============================================================ */

function ulangFoto() {

  fotoBase64 =
    '';


  preview.src =
    '';


  preview.classList.add(
    'hidden'
  );

  video.classList.remove(
    'hidden'
  );


  btnAmbil.classList.remove(
    'hidden'
  );

  btnGunakan.classList.add(
    'hidden'
  );

  btnUlang.classList.add(
    'hidden'
  );


  setStatus(
    '📷 Silakan ambil foto kembali.'
  );

}


/* ============================================================
   GUNAKAN FOTO
   ============================================================ */

function gunakanFoto() {

  if (!fotoBase64) {

    setStatus(
      '❌ Belum ada foto.'
    );

    return;
  }


  if (
    !window.opener ||
    window.opener.closed
  ) {

    setStatus(
      '❌ Halaman absensi utama sudah tertutup. Silakan buka kamera dari halaman absensi.'
    );

    return;
  }


  setStatus(
    '⏳ Mengirim foto ke halaman absensi...'
  );


  try {

    window.opener.postMessage(

      {

        type:
          'ABSENSI_CAMERA_RESULT',

        token:
          token,

        action:
          action,

        fotoBase64:
          fotoBase64

      },

      returnOrigin

    );


    /*
     * Beri waktu sedikit agar pesan
     * diterima oleh Apps Script.
     */

    setTimeout(
      function() {

        hentikanKamera();

        window.close();

      },
      500
    );


  } catch (error) {

    console.error(error);

    setStatus(
      '❌ Gagal mengirim foto ke halaman absensi.'
    );

  }

}


/* ============================================================
   BATAL
   ============================================================ */

function batal() {

  hentikanKamera();

  window.close();

}


/* ============================================================
   MATIKAN KAMERA
   ============================================================ */

function hentikanKamera() {

  if (!stream) {
    return;
  }


  stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );


  stream =
    null;

}


/* ============================================================
   JIKA HALAMAN DITUTUP
   ============================================================ */

window.addEventListener(
  'beforeunload',
  function() {

    hentikanKamera();

  }
);


/* ============================================================
   START CAMERA
   ============================================================ */

if (
  token &&
  action &&
  returnOrigin
) {

  bukaKamera();

}

</script>

</body>

</html>
